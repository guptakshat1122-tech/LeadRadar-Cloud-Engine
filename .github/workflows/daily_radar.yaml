name: 🚀 Bawa Cloud Engine Auto-Pilot

# Yeh set karta hai ki script roz subah 2:00 AM (UTC) par chalegi
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Yeh aapko manually button daba kar script run karne ki power deta hai

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 Fire The Master Controller
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python master_controller.py

    - name: 💾 Save Final VIP Leads as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIP_Leads_Archive
        path: master_control_room/*.csv