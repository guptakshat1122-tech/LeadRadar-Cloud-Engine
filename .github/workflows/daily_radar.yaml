name: 🚀 Bawa Cloud Engine Auto-Pilot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ♻️ Restore Pipeline Queue State
        uses: actions/cache@v4
        with:
          path: |
            processing_queue
            ai_queue
            state
          key: pipeline-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pipeline-state-${{ github.ref_name }}-
            pipeline-state-

      - name: 🔥 Fire The Master Controller
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_RUNTIME_SECONDS: '19800'
          SAFETY_RESERVE_SECONDS: '60'
          GROQ_CLAIM_SIZE: '50'
        run: |
          python master_controller.py

      - name: 💾 Commit Durable Pipeline + Queue State
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "bawa-leads-bot"
          git config user.email "actions@users.noreply.github.com"

          echo "🔄 Refreshing repository before durable commit..."

          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME}"

          echo "📦 Staging durable pipeline state..."

          for path in \
            daily_domains \
            processing_queue \
            ai_queue \
            master_control_room \
            state
          do
            if [ -e "$path" ]; then
              echo "   ✅ Adding: $path"
              git add -f "$path"
            else
              echo "   ℹ️ Missing: $path — skipping"
            fi
          done

          if git diff --cached --quiet; then
            echo "ℹ️ No durable state changes to commit."
            exit 0
          fi

          git commit -m "🤖 Auto-update pipeline state $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          for attempt in 1 2 3 4 5; do

            echo "🚀 Push attempt $attempt/5"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ Durable state pushed successfully."
              exit 0
            fi

            echo "⚠️ Push conflict — refreshing..."

            git fetch origin
            git pull --rebase origin "${GITHUB_REF_NAME}" || true

            sleep 2
          done

          echo "❌ Durable state push failed after 5 attempts."
          exit 1

      - name: 📤 Upload Final VIP Leads as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIP_Leads_Archive
          path: master_control_room/*.csv
          if-no-files-found: warn
          retention-days: 90
