name: 🚀 Bawa Cloud Engine Auto-Pilot

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ♻️ Restore Pipeline Queue State
        uses: actions/cache@v4
        with:
          path: |
            processing_queue
            ai_queue
            state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      - name: 🔥 Fire The Master Controller
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_RUNTIME_SECONDS: '19800'       # 5h30m controller budget
          SAFETY_RESERVE_SECONDS: '60'
          GROQ_CLAIM_SIZE: '50'
        run: |
          python master_controller.py

      # The controller and/or an Ollama laptop worker may push while the job
      # is running. Re-sync before committing durable repo state.
      - name: 💾 Commit Durable Pipeline + Queue State
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "bawa-leads-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "🔄 Git sync attempt $attempt/5"

            git fetch origin
            git pull --rebase origin "${GITHUB_REF_NAME}"

            git add \
              daily_domains/ \
              processing_queue/ \
              ai_queue/ \
              master_control_room/ \
              state/ || true

            if git diff --cached --quiet; then
              echo "Koi durable data/state change nahi hua."
              exit 0
            fi

            git commit -m "🤖 Auto-update: pipeline data + queue state $(date -u +'%Y-%m-%d')"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ Push successful."
              exit 0
            fi

            echo "⚠️ Push conflict/rejection; retrying after refresh..."
            git reset --soft HEAD~1
            git reset
            sleep 2
          done

          echo "❌ Could not push durable pipeline state after retries."
          exit 1

      - name: 📤 Upload Final VIP Leads as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIP_Leads_Archive
          path: master_control_room/*.csv
          if-no-files-found: warn
          retention-days: 90
